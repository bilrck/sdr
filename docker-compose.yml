services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sdr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdr_intelligent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - sdr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: sdr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sdr_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: sdr_evolution_api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://localhost:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-42D8E424-E342-4D9E-BF6C-21FC8CA5}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/sdr_intelligent?schema=evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379/1"
      CACHE_REDIS_PREFIX_KEY: "evolution"
      CACHE_REDIS_SAVE_INSTANCES: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: "http://host.docker.internal:3030/webhook/whatsapp/receive"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sdr_evolution_instances:/evolution/instances

  sdr-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdr_app
    restart: unless-stopped
    ports:
      - "3030:3030"
    env_file:
      - .env
    environment:
      PORT: 3030
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@postgres:5432/sdr_intelligent?schema=public
      EVOLUTION_API_URL: http://evolution-api:8080
    depends_on:
      postgres:
        condition: service_healthy
      evolution-api:
        condition: service_started

volumes:
  sdr_pgdata:
    driver: local
  sdr_redisdata:
    driver: local
  sdr_evolution_instances:
    driver: local
